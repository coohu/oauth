[package]
name = "oauth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.15" 
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
