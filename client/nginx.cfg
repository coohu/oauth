http {
    upstream oauth_service {
        server auth-proxy:8084;
    }

    upstream business_service {
        server biz-app:9000;
    }

    server {
        listen 80;
        location /api/v1/ {
            auth_request /auth_verify;
            large_client_header_buffers 4 8k;
            auth_request_set $user_data $upstream_http_x_user_data_base64;
            proxy_set_header X-User-Data-Base64 $user_data;

            proxy_pass http://business_service;
        }

        # 2. 内部认证接口 (对外部不可见)
        location = /auth_verify {
            internal;
            proxy_pass http://127.0.0.1:8084/me;
            large_client_header_buffers 4 8k;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;

        }
        error_page 401 = @error401;
        location @error401 {
            return 401 '{"error": "Unauthorized", "message": "Invalid or expired token"}';
            add_header Content-Type application/json;
        }
    }
}